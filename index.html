<!DOCTYPE html>
<!--
  MONTH 18. happiestt anniversaryy gugluu. For gugluu, from gullaa.

  A chat app that looks a lot like Claude, except the assistant is gullaa
  and every chat in the sidebar is one of our months. The 18th stays
  locked until she has opened the other seventeen.

  FILES NEXT TO THIS ONE (GitHub Pages is case sensitive, keep names exact):
    photos/      every photo the chats use
    songs/       six songs, one per stretch of months (see SONGS below).
                 They start on her first tap and crossfade as she moves on.

  EDIT THE WORDS: everything she reads is at the very bottom of this file:
    MONTHS     the month chats (title, her question, photos, story)
    EIGHTEEN   the locked 18th chat and the letter that opens from it
    SONGS      which song plays where, and the second each one starts at
    SITE      greeting, tutorial, gullaa's canned replies, little jokes

  TESTING: add ?unlock to the url to open the 18th without reading the
  rest. Add ?reset to forget what's been read and see the tutorial again.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>gullaa</title>
<meta property="og:title" content="happiestt anniversaryy gugluu">
<meta property="og:description" content="eighteen months. eighteen chats.">
<meta property="og:image" content="https://yuguuvermaa.github.io/eighteen/photos/og.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --side:#F3F1EA; --surface:#FFFFFF; --bubble:#EFECE3;
  --hover:rgba(31,30,29,.055); --active:rgba(31,30,29,.09);
  --line:rgba(31,30,29,.12); --line-2:rgba(31,30,29,.2);
  --text:#1F1E1D; --text-2:#3D3D3A; --muted:#73726C; --faint:#A3A199;
  --clay:#D97757; --clay-2:#C6613F; --clay-soft:rgba(217,119,87,.13);
  --scrim:rgba(20,20,19,.38); --spot:rgba(20,20,19,.52);
  --shadow:0 .25rem 1.25rem rgba(0,0,0,.04),0 0 0 .5px rgba(31,30,29,.16);
  --pop:0 12px 32px rgba(0,0,0,.13),0 0 0 .5px rgba(31,30,29,.16);
  --serif:"Source Serif 4",ui-serif,"New York",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sidew:288px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#262624; --side:#1F1E1D; --surface:#30302E; --bubble:#141413;
  --hover:rgba(250,249,245,.05); --active:rgba(250,249,245,.085);
  --line:rgba(222,220,209,.13); --line-2:rgba(222,220,209,.22);
  --text:#F5F4EE; --text-2:#E3E1D8; --muted:#A6A39A; --faint:#7A7871;
  --clay-soft:rgba(217,119,87,.17);
  --shadow:0 .25rem 1.25rem rgba(0,0,0,.25),0 0 0 .5px rgba(222,220,209,.16);
  --pop:0 12px 32px rgba(0,0,0,.45),0 0 0 .5px rgba(222,220,209,.18);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.spark{display:inline-block;color:var(--clay);flex:none;line-height:0}
.spark svg{width:100%;height:100%;overflow:visible}
.spark .rays{transform-box:view-box;transform-origin:24px 24px}
.spark.spin .rays{animation:spin 2.6s linear infinite}
.spark.spin .hrt{animation:beat 1.3s ease-in-out infinite;transform-box:view-box;transform-origin:24px 24px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}

/* ───────── layout ───────── */
.app{display:flex;height:100vh;height:100dvh}
.side{width:var(--sidew);flex:none;display:flex;flex-direction:column;background:var(--side);border-right:.5px solid var(--line);min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scrim{display:none}

/* ───────── sidebar ───────── */
.side-top{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 16px;height:52px}
.brand{display:flex;align-items:center;gap:8px;font:500 21px/1 var(--serif);letter-spacing:-.01em;flex:1}
.brand .spark{width:22px;height:22px}
.newchat{display:flex;align-items:center;gap:10px;margin:6px 8px 2px;padding:7px 8px;border-radius:10px;border:0;background:none;font-weight:500;font-size:14.5px;text-align:left}
.newchat:hover{background:var(--hover)}
.newchat .pc{width:26px;height:26px;border-radius:50%;background:var(--clay-2);color:#fff;display:grid;place-items:center}
.newchat .pc .ic{width:16px;height:16px;stroke-width:2.2}
.side-scroll{flex:1;overflow-y:auto;padding:2px 8px 14px;overscroll-behavior:contain}
.sec{font-size:12px;font-weight:500;color:var(--muted);padding:14px 8px 5px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:14px;color:var(--text-2);transition:background .15s}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:var(--hover)}
.item.on{background:var(--active);color:var(--text)}
.item .dot{width:7px;height:7px;border-radius:50%;background:var(--clay);flex:none}
.item .ic{width:16px;height:16px;color:var(--muted)}
.item.star .ic{color:var(--clay)}
.item.pulse{animation:pulse 1.1s ease 3}
.item.glow{box-shadow:inset 0 0 0 1px var(--clay)}
@keyframes pulse{0%,100%{background:transparent}50%{background:var(--clay-soft)}}
.side-foot{border-top:.5px solid var(--line);padding:8px;position:relative}
.me{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:10px;text-align:left}
.me:hover{background:var(--hover)}
.av{width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.me .who{flex:1;min-width:0}
.me b{display:block;font-weight:500;font-size:14px;line-height:1.25}
.me small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.me .ic{width:16px;height:16px;color:var(--muted)}

/* ───────── top bar ───────── */
.top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px}
.top .title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;padding-left:8px}
.top .title b{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ibtn{width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--text-2);display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--hover)}
.btn-line{height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn-line .ic{width:15px;height:15px}
.btn-line:hover{background:var(--hover)}
.only-m{display:none!important}

/* ───────── home ───────── */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px 9vh}
.home::before,.home::after{content:"";flex:1}
.home-in{width:100%;max-width:42rem}
.greet{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 8px;font:300 clamp(2rem,5vw,2.65rem)/1.15 var(--serif);letter-spacing:-.015em;text-align:center;flex-wrap:wrap}
.greet .spark{width:clamp(36px,6vw,44px);height:clamp(36px,6vw,44px);animation:sparkIn 1s var(--ease) both}
.greet .gw{display:inline-block;white-space:nowrap}
.greet .ch{display:inline-block;animation:chIn .55s var(--ease) both}
.greet.done .ch,.greet.done .spark{animation:none}
@keyframes sparkIn{from{opacity:0;transform:scale(.3) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes chIn{from{opacity:0;transform:translateY(.3em);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.since{text-align:center;font-size:13px;color:var(--muted);margin:0 0 26px;font-variant-numeric:tabular-nums}
.egg{text-align:center;font:italic 16px var(--serif);color:var(--clay-2);margin:-16px 0 22px}
.later{opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.home.ready .later{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{height:34px;padding:0 12px;border-radius:9px;border:.5px solid var(--line-2);background:transparent;color:var(--text-2);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hover);color:var(--text)}
.foot{text-align:center;font-size:12px;color:var(--faint);margin:12px 0 0}

/* ───────── composer ───────── */
.composer{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 10px 10px 16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s}
.composer:focus-within{box-shadow:0 .25rem 1.25rem rgba(0,0,0,.07),0 0 0 .5px var(--line-2)}
.composer textarea{border:0;outline:0;resize:none;background:transparent;font:16px/1.5 var(--sans);color:var(--text);padding:2px 6px 0 0;max-height:200px;min-height:24px;width:100%}
.composer textarea::placeholder{color:var(--faint)}
.c-row{display:flex;align-items:center;gap:6px}
.c-row .grow{flex:1}
.c-btn{width:32px;height:32px;border-radius:8px;border:.5px solid var(--line-2);background:transparent;color:var(--text-2);display:grid;place-items:center}
.c-btn:hover{background:var(--hover)}
.c-btn .ic{width:17px;height:17px}
.model-wrap{position:relative}
.model{border:0;background:none;color:var(--text-2);font-size:13.5px;display:inline-flex;align-items:center;gap:3px;padding:6px 8px;border-radius:8px;white-space:nowrap}
.model:hover{background:var(--hover)}
.model .ic{width:14px;height:14px}
.send{width:32px;height:32px;border-radius:8px;border:0;background:var(--clay-2);color:#fff;display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.4;cursor:default}
.send .ic{width:18px;height:18px;stroke-width:2.2}
.send .ic.fill{width:12px;height:12px;stroke:none}

/* ───────── chat ───────── */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:46rem;margin:0 auto;padding:16px 20px 40px}
.dock{flex:none;width:100%;max-width:48rem;margin:0 auto;padding:0 16px calc(10px + env(safe-area-inset-bottom))}
.dock .foot{margin:8px 0 0}
.range{text-align:center;font-size:12px;color:var(--faint);margin:4px 0 22px;letter-spacing:.02em}

.m-user{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin:0 0 28px}
.atts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(100%,30rem)}
.att{border:0;padding:0;background:var(--bubble);border-radius:14px;overflow:hidden;cursor:zoom-in;box-shadow:0 0 0 .5px var(--line);aspect-ratio:1/1;width:min(27vw,9.25rem)}
.atts.n1 .att{width:min(74vw,19rem);aspect-ratio:4/5}
.atts.n2 .att,.atts.n4 .att{width:min(38vw,13.5rem);aspect-ratio:4/5}
.att img,.att video{display:block;width:100%;height:100%;object-fit:cover}
.missing{display:none!important}
.bubble{background:var(--bubble);border-radius:18px;padding:10px 16px;max-width:min(85%,36rem);font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

.m-ai{margin:0 0 34px}
.thinking{display:flex;align-items:center;gap:10px;font-size:14.5px;height:30px}
.thinking .spark{width:24px;height:24px}
.shim{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 35%,var(--text) 50%,var(--muted) 65%,var(--muted) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.tbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 0;color:var(--muted);font-size:14px}
.tbtn:hover{color:var(--text)}
.tbtn .ic{width:15px;height:15px;transition:transform .2s}
.tbtn[aria-expanded="true"] .ic{transform:rotate(90deg)}
.tbody{margin:6px 0 4px;padding:2px 0 2px 14px;border-left:2px solid var(--line-2);color:var(--muted);font:italic 16px/1.6 var(--serif)}
.ai{font:17px/1.72 var(--serif);color:var(--text);margin-top:8px;overflow-wrap:break-word}
.ai p{margin:0 0 1em}
.ai > :last-child{margin-bottom:0}
.ai .sher{margin:1.1em 0;padding:.15em 0 .15em 1em;border-left:3px solid var(--clay);font-style:italic;color:var(--text-2)}
.ai .sher .l{display:block}
.ai figure{margin:1.2em 0}
.ai .zoomfig{border:0;padding:0;background:none;display:block;width:100%;cursor:zoom-in}
.ai figure img,.ai figure video{display:block;width:100%;max-height:72vh;object-fit:cover;border-radius:14px}
.ai figcaption{font-size:13px;font-family:var(--sans);color:var(--muted);margin-top:8px}
.m-ai.streaming .blk:not(.on),.m-ai.streaming .w:not(.on){display:none}
.m-ai.streaming .w.on{animation:wIn .45s ease}
.m-ai.streaming .blk.on.fig,.m-ai.streaming .blk.on.art-card{animation:wIn .6s ease}
@keyframes wIn{from{opacity:0}to{opacity:1}}
.ai-foot{display:flex;align-items:center;gap:2px;margin-top:14px;min-height:30px}
.ai-foot .spark{width:26px;height:26px;margin-right:8px}
.abtn{width:30px;height:30px;border-radius:7px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.abtn:hover{background:var(--hover);color:var(--text)}
.abtn .ic{width:17px;height:17px}
.abtn.turn .ic{animation:spin .7s var(--ease)}

.art-card{display:flex;align-items:center;gap:12px;width:100%;max-width:26rem;border:.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:10px 14px 10px 10px;margin:1.2em 0 .3em;text-align:left;font-family:var(--sans);color:var(--text);transition:border-color .2s,transform .2s}
.art-card:hover{border-color:var(--clay)}
.art-card:active{transform:scale(.99)}
.art-ico{width:44px;height:52px;border-radius:8px;background:var(--bubble);display:grid;place-items:center;color:var(--clay-2);flex:none}
.art-card b{display:block;font-weight:500;font-size:15px}
.art-card small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

.limit{margin:8vh auto 0;max-width:28rem;text-align:center;padding:28px 24px 22px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.limit .lk{width:46px;height:46px;border-radius:50%;background:var(--clay-soft);color:var(--clay-2);display:grid;place-items:center;margin:0 auto 14px}
.limit h3{font:400 21px/1.3 var(--serif);margin:0 0 8px}
.limit p{color:var(--text-2);font-size:15px;line-height:1.6;margin:0 0 16px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 18px}
.bar i{display:block;height:100%;background:var(--clay);border-radius:3px}
.limit .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.limit small{display:block;color:var(--faint);font-size:12.5px;margin-top:14px}
.btn{height:36px;padding:0 14px;border-radius:9px;font-weight:500;font-size:14px}
.btn-ghost{border:.5px solid var(--line-2);background:transparent;color:var(--text)}
.btn-ghost:hover{background:var(--hover)}
.btn-clay{border:0;background:var(--clay-2);color:#fff}
.btn-clay:hover{filter:brightness(1.06)}

/* ───────── artifact panel (the letter) ───────── */
.artifact{display:none;width:min(48vw,640px);flex:none;flex-direction:column;background:var(--bg);border-left:.5px solid var(--line);min-height:0}
.artifact.show{display:flex}
.art-head{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:.5px solid var(--line)}
.art-head .art-ico{width:30px;height:34px;border-radius:6px}
.art-head .art-ico .ic{width:16px;height:16px}
.art-head .hd{flex:1;min-width:0}
.art-head b{display:block;font-weight:500;font-size:14.5px;line-height:1.2}
.art-head small{display:block;color:var(--muted);font-size:12px}
.art-body{flex:1;overflow-y:auto;padding:40px 24px 64px}
.letter{max-width:36rem;margin:0 auto;font:18px/1.78 var(--serif);color:var(--text)}
.letter .to{font-style:italic;margin:0 0 1.2em}
.letter p{margin:0 0 1.15em}
.letter .sign{text-align:right;font-style:italic;margin-top:1.8em}
.next{max-width:36rem;margin:48px auto 0;padding:22px 20px;border-radius:16px;background:var(--side);text-align:center}
.next .k{font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-2)}
.next .d{font:400 22px/1.3 var(--serif);margin:8px 0 4px}
.next .cd{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:15px}
.next small{display:block;color:var(--muted);margin-top:8px;font-size:13px}

/* ───────── menus, toast, overlays ───────── */
.menu{position:absolute;z-index:60;min-width:260px;background:var(--surface);border-radius:12px;box-shadow:var(--pop);padding:6px}
.mi{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;line-height:1.35}
.mi:hover{background:var(--hover)}
.mi .ic{width:16px;height:16px;margin-top:1px;color:var(--clay-2)}
.mi .sp{width:16px;flex:none}
.mi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mi.off{opacity:.55}
.mh{padding:8px 10px 10px;border-bottom:.5px solid var(--line);margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.mh b{display:block;color:var(--text);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px}
#modelMenu{right:0;top:calc(100% + 6px)}
.dock #modelMenu{top:auto;bottom:calc(100% + 6px)}
#meMenu{left:8px;right:8px;bottom:calc(100% + 2px)}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:95;background:var(--text);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);max-width:calc(100vw - 32px);width:max-content;text-align:center;box-shadow:var(--pop)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.np{position:fixed;top:calc(58px + env(safe-area-inset-top));right:12px;z-index:94;display:flex;align-items:center;gap:9px;background:var(--text);color:var(--bg);font-size:13px;padding:8px 14px 8px 12px;border-radius:999px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .35s,transform .35s var(--ease);box-shadow:var(--pop);max-width:calc(100vw - 24px);white-space:nowrap}
.np.on{opacity:1;transform:none}
.np .eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.np .eq i{width:3px;height:100%;border-radius:2px;background:var(--clay);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.np .eq i:nth-child(2){animation-delay:-.3s}.np .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.np .eq i{animation:none;transform:scaleY(.7)}}
.heart{position:fixed;z-index:96;pointer-events:none;line-height:1;animation:fly 1.6s var(--ease) both}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r))}}

.tut-catch{position:fixed;inset:0;z-index:80}

function aiMsg(o){
  const myGen = gen;
  const wrap = el('div', 'm-ai'), top = el('div', 'ai-top'), body = el('div', 'ai'), foot = el('div', 'ai-foot');
  wrap.append(top, body, foot); thread.append(wrap);

  };

  wrap.classList.add('streaming');
  top.innerHTML = `<div class="thinking">${sparkEl('spin')}<span class="shim">${esc(SITE.thinking)}</span></div>`;
  let t, stopper = null;
  const begin = fast => {

    foot.innerHTML = sparkEl('spin');

    stopper = streamInto(body, finish, myGen);

    if (fast) stopper();
  };
  setStreaming(true, () => begin(true));

function wordify(root){
  const out = [], nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const parts = tn.nodeValue.match(/\S+\s*|\s+/g); if (!parts) return;
    const frag = document.createDocumentFragment();
    parts.forEach(p => { const s = el('span', 'w'); s.textContent = p; frag.append(s); out.push(s); });
    tn.replaceWith(frag);
  });
  return out;
}
function streamInto(body, done, myGen){
  const steps = [];
  body.querySelectorAll('.blk').forEach(blk => {
    steps.push({ el: blk });
    if (blk.classList.contains('fig') || blk.classList.contains('art-card')) { steps.push({ wait: 700 }); return; }
    wordify(blk).forEach(w => steps.push({ el: w, word: true }));
    steps.push({ wait: 280 });
  });
  let i = 0, timer = null, ended = false;
  const end = () => { if (!ended){ ended = true; done(); } };
  const run = () => {
    if (myGen !== gen || ended) return;
    let n = 1 + (Math.random() * 2 | 0), delay = 40;
    while (i < steps.length && n > 0){
      const s = steps[i++];
      if (s.el) s.el.classList.add('on');
      if (s.wait){ delay = s.wait; break; }
      if (s.word) n--;
    }
    follow();
    if (i >= steps.length) return end();
    timer = setTimeout(run, delay);
  };
  run();
  return () => { clearTimeout(timer); while (i < steps.length){ const s = steps[i++]; if (s.el) s.el.classList.add('on'); } follow(); end(); };
}
function follow(force){
  if (force) stick = true;
  if (stick) scroller.scrollTop = scroller.scrollHeight;

/* ═════════ songs ═════════
   Two players take turns: the new song fades in on one while the old one fades
   out on the other. iPhones ignore .volume, so there the fades run through Web
   Audio instead (set to "playback" so the silent switch doesn't mute it). */
const VOL = .8, FADE = 2.6;
const soundBtn = $('#soundBtn'), np = $('#np');
const volumeWorks = (() => { try { const a = new Audio(); a.volume = .5; return a.volume === .5; } catch (e) { return true; } })();
const AC = window.AudioContext || window.webkitAudioContext;
const useWA = !!AC && (!volumeWorks || /[?&]webaudio\b/.test(location.search));   /* ?webaudio tests the iPhone path on a laptop */
const decks = [$('#deckA'), $('#deckB')].map(a => ({ a, g: null, song: null, t: null }));
let wantSound = true, started = false, actx = null, live = null, wanted = null, switchId = 0, npT;

const songFor = v => SONGS.find(s => v === 'home' ? s.plays === 'home' : Array.isArray(s.plays) && v >= s.plays[0] && v <= s.plays[1]);
const srcOf = s => s.file + (s.from ? '#t=' + s.from : '');
const playing = () => decks.some(d => !d.a.paused && d.song);

function setGain(d, v, secs){
  d.a.dataset.to = v;   /* where it's heading, handy when checking the fades */
  if (d.g){
    const p = d.g.gain, t = actx.currentTime;
    p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + secs);
  } else if (volumeWorks){
    clearInterval(d.t);
    const from = d.a.volume, t0 = performance.now();
    d.t = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / (secs * 1000));
      d.a.volume = from + (v - from) * k;
      if (k >= 1) clearInterval(d.t);
    }, 33);
  } else if (v === 0) d.a.pause();   /* an old iPhone with no fades: just a clean cut */
}
function setGainNow(d, v){ if (d.g){ d.g.gain.cancelScheduledValues(0); d.g.gain.value = v; } else if (volumeWorks){ clearInterval(d.t); d.a.volume = v; } }
function fadeOut(d, secs){ setGain(d, 0, secs); const k = d.k; setTimeout(() => { if (d.k === k && (d !== live || !wantSound)) d.a.pause(); }, secs * 1000 + 150); }

/* the view changed: home, or a month number */
function music(view){
  const s = songFor(view);
  if (!s) return;
  wanted = s;
  if (started && wantSound) switchTo(s);
}
function switchTo(s){
  if (live && live.song === s && !live.a.paused) return;   /* already playing */
  const id = ++switchId, out = live && !live.a.paused ? live : null;
  const inn = decks.find(d => d !== live) || decks[0];
  if (inn.song === s && !inn.a.paused){            /* came straight back while it was still fading out */
    live = inn; setGain(inn, VOL, FADE); if (out) fadeOut(out, FADE); showNP(s); return;
  }
  inn.song = s; inn.k = (inn.k || 0) + 1; setGainNow(inn, 0); inn.a.dataset.song = s.name;
  inn.a.src = srcOf(s);
  const p = inn.a.play();
  if (p && p.then) p.then(() => {
    if (id !== switchId) return;
    live = inn; setGain(inn, VOL, out ? FADE : 1.5);
    if (out) fadeOut(out, FADE);
    showNP(s); paintSound();
  }).catch(() => { if (id === switchId) inn.song = null; });   /* missing file: the old song keeps playing */
}
function showNP(s){
  if (!wantSound) return;
  $('#npText').textContent = `now playing · ${s.name}`;
  np.classList.add('on'); clearTimeout(npT); npT = setTimeout(() => np.classList.remove('on'), 3400);
}

/* first tap: wake the audio up (both players, inside the tap, so iPhones let them play later) */
function start(){
  if (started) return true;
  started = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (useWA){
    try {
      actx = new AC();
      decks.forEach(d => { d.g = actx.createGain(); d.g.gain.value = 0; actx.createMediaElementSource(d.a).connect(d.g).connect(actx.destination); });
    } catch (e) { actx = null; decks.forEach(d => { d.g = null; }); }
  }
  if (actx && actx.state !== 'running') actx.resume().catch(() => {});
  const s = wanted || songFor('home');
  switchTo(s);
  /* the second player has to be started inside a tap too, or an iPhone won't let it play later */
  const spare = decks.find(d => !d.song);
  if (actx && spare){ setGainNow(spare, 0); spare.a.src = srcOf(s); spare.a.play().then(() => { if (!spare.song) spare.a.pause(); }).catch(() => {}); }
  return true;
}
function wake(){ if (actx && actx.state !== 'running') actx.resume().catch(() => {}); }
addEventListener('pointerdown', e => { wake(); if (!e.target.closest('#soundBtn') && wantSound) start(); }, true);
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ wake(); if (wantSound) start(); } }, true);

function paintSound(){ const on = wantSound && playing(); soundBtn.innerHTML = ic(on ? 'sound' : 'mute'); soundBtn.setAttribute('aria-label', on ? 'Pause music' : 'Play music'); }
soundBtn.addEventListener('click', () => {
  if (wantSound && playing()){
    wantSound = false; decks.forEach(d => { if (!d.a.paused) fadeOut(d, .5); }); np.classList.remove('on');
  } else {
    wantSound = true; wake();
    if (!started) start();
    else if (live && live.song === wanted){ live.a.play().catch(() => {}); setGain(live, VOL, .8); showNP(live.song); }
    else switchTo(wanted || songFor('home'));
  }
  setTimeout(paintSound, 600);
});
decks.forEach(d => {
  /* at the end, go back to the start point and fade in again, same as the first time */
  d.a.addEventListener('ended', () => { if (d === live && wantSound){ setGainNow(d, 0); d.a.currentTime = d.song.from || 0; d.a.play().catch(() => {}); setGain(d, VOL, FADE); } });
  /* backup for browsers that ignore the #t= start time */
  d.a.addEventListener('loadedmetadata', () => { const f = d.song && d.song.from; if (f && Math.abs(d.a.currentTime - f) > 1) d.a.currentTime = f; });
  d.a.addEventListener('play', paintSound); d.a.addEventListener('pause', paintSound);
});
paintSound();

/* ═════════ little things ═════════ */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2900); }
function copyText(text){
  const ok = () => toast(SITE.toasts.copy);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ok);
  else ok();
}
function hearts(from, n){
  if (RM || !from) return;
  const r = from.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < n; i++){
    const h = el('span', 'heart');
    h.textContent = Math.random() < .18 ? '🧿' : '💗';
    h.style.left = x + 'px'; h.style.top = y + 'px';
    h.style.fontSize = (13 + Math.random() * 12) + 'px';
    h.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
    h.style.setProperty('--dy', -(70 + Math.random() * 170) + 'px');
    h.style.setProperty('--r', (Math.random() * 70 - 35) + 'deg');
    h.style.animationDelay = (i * 30) + 'ms';
    document.body.append(h);
    setTimeout(() => h.remove(), 2400);
  }
}
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (lb.classList.contains('on')) return closeLB();
  if ([...document.querySelectorAll('.menu')].some(m => !m.hidden)) return hideMenus();
  if (showTutorial.close && $('.tut-card')) return showTutorial.close();
  if (art.classList.contains('show')) return closeArtifact();
  if (side.classList.contains('open')) return closeDrawer();
});
addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'ArrowLeft') lbStep(-1);
  if (e.key === 'ArrowRight') lbStep(1);
});

route();
})();
</script>
